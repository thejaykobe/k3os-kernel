name: build

on:
  push:
    branches:
      - master
      - 'jammy/**'
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - 'jammy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-amd64:
    name: build-amd64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-kernel
        with:
          arch: amd64

  build-arm64:
    name: build-arm64
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-kernel
        with:
          arch: arm64

  release:
    name: release
    needs: [build-amd64, build-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist/artifacts
          sha256sum * > CHECKSUMsum.txt
          ls -lah

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/artifacts/*
