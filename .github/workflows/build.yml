name: build

on:
  push:
    branches:
      - master
      - 'jammy/**'
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - 'jammy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-amd64-self-hosted:
    name: build-amd64 (self-hosted)
    runs-on: [self-hosted, Linux, X64]
    continue-on-error: true
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-kernel
        with:
          arch: amd64

  build-amd64-fallback:
    name: build-amd64 (GHA fallback)
    needs: build-amd64-self-hosted
    if: always() && needs.build-amd64-self-hosted.result != 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-kernel
        with:
          arch: amd64

  build-arm64:
    name: build-arm64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-kernel
        with:
          arch: arm64

  release:
    name: release
    needs: [build-amd64-self-hosted, build-amd64-fallback, build-arm64]
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-arm64.result == 'success' &&
      (needs.build-amd64-self-hosted.result == 'success' || needs.build-amd64-fallback.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist/artifacts
          sha256sum * > CHECKSUMsum.txt
          ls -lah

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/artifacts/*
