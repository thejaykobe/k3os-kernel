name: Build kernel
description: Build the k3os kernel via dapper, with pre/post purge of workspace and docker state.
inputs:
  arch:
    description: Architecture (amd64 or arm64) — used in the artifact name.
    required: true
runs:
  using: composite
  steps:
    - name: Pre-build purge (workspace + docker)
      shell: bash
      run: |
        set -x
        df -h || true
        git clean -ffdx || true
        docker system prune -af --volumes || true
        df -h || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build kernel via dapper
      shell: bash
      run: make ci

    - name: Show artifacts
      shell: bash
      run: ls -lah dist/artifacts || true

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ inputs.arch }}
        path: dist/artifacts/
        if-no-files-found: error
        retention-days: 14

    - name: Post-build purge (workspace + docker)
      if: always()
      shell: bash
      run: |
        set -x
        df -h || true
        git clean -ffdx || true
        docker system prune -af --volumes || true
        df -h || true
