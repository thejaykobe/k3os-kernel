name: build

on:
  push:
    branches:
      - master
      - 'jammy/**'
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - 'jammy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            emulated: false
          - arch: arm64
            runner: ubuntu-22.04-arm
            emulated: false
          - arch: arm
            runner: ubuntu-22.04
            emulated: true
            platform: linux/arm/v7
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        if: matrix.emulated
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kernel via dapper (native)
        if: ${{ !matrix.emulated }}
        run: make ci

      - name: Build kernel via docker (emulated ${{ matrix.platform }})
        if: matrix.emulated
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          docker buildx build \
            --platform "${PLATFORM}" \
            --build-arg DAPPER_HOST_ARCH="${ARCH}" \
            --load \
            -t k3os-kernel-builder:${ARCH} \
            -f Dockerfile.dapper .

          mkdir -p dist build
          docker run --rm --privileged \
            --platform "${PLATFORM}" \
            -e ARCH="${ARCH}" \
            -e DAPPER_UID="$(id -u)" \
            -e DAPPER_GID="$(id -g)" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            -v "$(pwd)":/source \
            -w /source \
            k3os-kernel-builder:${ARCH} ci

      - name: Show artifacts
        run: ls -lah dist/artifacts || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist/artifacts
          sha256sum * > CHECKSUMsum.txt
          ls -lah

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/artifacts/*
